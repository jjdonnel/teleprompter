<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VO Studio Teleprompter - App Logo</title>
  <style>
    :root {
      --bg-color: #030712;
      --card-bg: #0b132b;
      --border-color: rgba(27, 84, 254, 0.3);
      --primary-blue: #1b54fe;
      --accent-cyan: #00e5ff;
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(27, 84, 254, 0.15);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary-blue), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .logo-wrapper {
      width: 240px;
      height: 240px;
      margin: 0 auto 28px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.2));
    }

    .logo-wrapper svg {
      width: 100%;
      height: 100%;
      border-radius: 24px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      background: linear-gradient(135deg, #1b54fe, #00a8ff);
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(27, 84, 254, 0.3);
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .copied-toast {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--accent-cyan);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .copied-toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>VO Studio Teleprompter</h1>
    <p class="subtitle">Manifest & App Icon Preview</p>

    <!-- Vector Logo Display -->
    <div class="logo-wrapper" id="logoContainer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
        <defs>
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B132B" />
            <stop offset="100%" stop-color="#030712" />
          </linearGradient>

          <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1B54FE" />
            <stop offset="50%" stop-color="#00A8FF" />
            <stop offset="100%" stop-color="#00E5FF" />
          </linearGradient>

          <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
        <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3" />

        <g filter="url(#neonGlow)">
          <!-- Outer Teleprompter Frame -->
          <rect x="96" y="96" width="320" height="320" rx="32" fill="#060C1A" stroke="#1B54FE" stroke-width="6" stroke-opacity="0.6" />
          
          <!-- Microphone Icon -->
          <rect x="216" y="140" width="80" height="120" rx="40" fill="url(#accentGrad)" />
          <line x1="226" y1="185" x2="286" y2="185" stroke="#0B132B" stroke-width="5" stroke-linecap="round" opacity="0.6" />
          <path d="M 186 195 C 186 270, 326 270, 326 195" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />
          <line x1="256" y1="258" x2="256" y2="288" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />
          <line x1="216" y1="288" x2="296" y2="288" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />

          <!-- 3 Scrolling Lines Underneath -->
          <line x1="140" y1="324" x2="372" y2="324" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" opacity="0.9" />
          <line x1="160" y1="348" x2="352" y2="348" stroke="#00A8FF" stroke-width="8" stroke-linecap="round" opacity="0.65" />
          <line x1="180" y1="372" x2="332" y2="372" stroke="#1B54FE" stroke-width="8" stroke-linecap="round" opacity="0.4" />
        </g>
      </svg>
    </div>

    <div class="btn-group">
      <button onclick="copySVG()">Copy SVG Code</button>
    </div>

    <div class="copied-toast" id="toast">SVG copied to clipboard!</div>
  </div>

  <script>
    function copySVG() {
      const svgContent = document.getElementById('logoContainer').innerHTML;
      navigator.clipboard.writeText(svgContent.trim()).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }
  </script>

</body>
</html>

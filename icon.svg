<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
        <defs>
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B132B"></stop>
            <stop offset="100%" stop-color="#030712"></stop>
          </linearGradient>

          <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1B54FE"></stop>
            <stop offset="50%" stop-color="#00A8FF"></stop>
            <stop offset="100%" stop-color="#00E5FF"></stop>
          </linearGradient>

          <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="blur"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
        </defs>

        <rect width="512" height="512" rx="112" fill="url(#bgGrad)"></rect>
        <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3"></rect>

        <g filter="url(#neonGlow)">
          <!-- Outer Teleprompter Frame -->
          <rect x="96" y="96" width="320" height="320" rx="32" fill="#060C1A" stroke="#1B54FE" stroke-width="6" stroke-opacity="0.6"></rect>
          
          <!-- Microphone Icon -->
          <rect x="216" y="140" width="80" height="120" rx="40" fill="url(#accentGrad)"></rect>
          <line x1="226" y1="185" x2="286" y2="185" stroke="#0B132B" stroke-width="5" stroke-linecap="round" opacity="0.6"></line>
          <path d="M 186 195 C 186 270, 326 270, 326 195" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"></path>
          <line x1="256" y1="258" x2="256" y2="288" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"></line>
          <line x1="216" y1="288" x2="296" y2="288" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"></line>

          <!-- 3 Scrolling Lines Underneath -->
          <line x1="140" y1="324" x2="372" y2="324" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" opacity="0.9"></line>
          <line x1="160" y1="348" x2="352" y2="348" stroke="#00A8FF" stroke-width="8" stroke-linecap="round" opacity="0.65"></line>
          <line x1="180" y1="372" x2="332" y2="372" stroke="#1B54FE" stroke-width="8" stroke-linecap="round" opacity="0.4"></line>
        </g>
      </svg>